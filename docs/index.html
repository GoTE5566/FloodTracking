<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3f4;--card:#fff;--ink:#12303a;--mute:#5d7480;--line:#cddbe0;--acc:#0b6e7f;--bad:#b3261e;--ok:#1b7a4b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b20;--card:#16282f;--ink:#e6f0f3;--mute:#93aab3;--line:#2a424b;--acc:#5cc3d4;--bad:#ff8a80;--ok:#6fd49c}}
:root[data-theme="dark"]{--bg:#0e1b20;--card:#16282f;--ink:#e6f0f3;--mute:#93aab3;--line:#2a424b;--acc:#5cc3d4;--bad:#ff8a80;--ok:#6fd49c}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 14px;font-weight:600}
.pick{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:44px}
select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
#proj{flex:1 1 320px}#day{flex:0 1 150px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h2{font-size:14px;font-weight:400;color:var(--mute);margin:0 0 6px}
.big{font-size:38px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}.big small{font-size:16px;font-weight:400;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:6px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.viz{margin-top:12px}svg{width:100%;height:auto;display:block}svg text{fill:var(--ink);font:12px "IBM Plex Sans Thai",Tahoma,sans-serif}
.form{margin-top:16px}.form h2{font-size:16px;color:var(--ink);font-weight:600}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:44px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}input:disabled{opacity:.5}
button{font:inherit;font-weight:600;min-height:44px;padding:0 22px;border:0;border-radius:6px;background:var(--acc);color:var(--bg);cursor:pointer}
#msg{margin-left:12px;font-size:14px;color:var(--mute)}
.pick{align-items:flex-end}.bar{display:none;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}.bar span{font-size:13px;color:var(--mute)}
body.view .pick,body.view .form{display:none!important}body.view .bar{display:flex}
@media print{:root:not([data-theme="light"]){--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#999;--bad:#b3261e;--ok:#1b7a4b}.pick,.form,.bar{display:none!important}main{padding:0}.card{break-inside:avoid}}
.dt::before{content:" · "}.ftn{display:none}
